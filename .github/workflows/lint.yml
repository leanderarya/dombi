name: linter

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  task12-production:
    strategy:
      matrix:
        include:
          - database: mysql
            connection: mysql
            port: 3306
            username: root
            password: root
          - database: postgres
            connection: pgsql
            port: 5432
            username: postgres
            password: postgres
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dombi_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dombi_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pcntl
      - run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
      - name: Run Task 12 production tests
        env:
          CI: true
          DB_CONNECTION: ${{ matrix.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: dombi_test
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: ${{ matrix.password }}
        run: >-
          test "$DB_CONNECTION" = "${{ matrix.connection }}" &&
          php artisan test
          tests/Feature/PaymentFulfilmentConcurrencyTest.php
          tests/Feature/PaymentCreationIdempotencyTest.php
          tests/Feature/PaymentRetryTest.php
          tests/Feature/PaymentRetryBoundaryTest.php
          tests/Feature/PaymentFailureFlowTest.php
          tests/Feature/PaymentOutboxTest.php
          tests/Feature/DokuReconciliationTest.php
          tests/Feature/DokuPaymentAtomicTest.php
          tests/Feature/DokuPaymentTest.php
          tests/Feature/DokuWebhookIngressTest.php
          tests/Feature/PaymentProductionInvariantTest.php
          tests/Feature/RefundLifecycleSchemaTest.php
          tests/Feature/RefundServiceTest.php
          tests/Feature/CompleteManualRefundRequestTest.php
          tests/Feature/RefundDestinationRequestTest.php
          tests/Feature/CustomerRefundDestinationTest.php
          tests/Feature/GuestRefundExperienceTest.php
          tests/Feature/ManualRefundMigrationTest.php
          tests/Feature/RefundEntryMatrixTest.php
          tests/Feature/RollbackRefundRequestTest.php
          tests/Feature/RefundRouteContractTest.php
          tests/Feature/PaymentAttemptSchemaTest.php
          tests/Feature/PaymentReliabilityTest.php
          tests/Feature/PaymentFeeIntegrationTest.php
          tests/Feature/SettlementPaymentFormatFixTest.php
          tests/Feature/PaymentAccountTest.php

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Run Pint
        run: composer run lint:check

      - name: Check changed frontend format
        shell: bash
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- 'resources/**/*.js' 'resources/**/*.jsx' 'resources/**/*.ts' 'resources/**/*.tsx' 'resources/**/*.css' 'resources/**/*.json' 'resources/**/*.md')
          if [ -n "$files" ]; then
            npx prettier --check $files
          fi
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Lint changed frontend
        shell: bash
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- 'resources/**/*.js' 'resources/**/*.jsx' 'resources/**/*.ts' 'resources/**/*.tsx')
          if [ -n "$files" ]; then
            npx eslint $files
          fi
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
