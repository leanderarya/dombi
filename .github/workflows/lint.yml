name: linter

on:
  push:
    branches: [never]

permissions:
  contents: write

jobs:
  task12-production:
    strategy:
      matrix:
        database: [mysql, postgres]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dombi_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dombi_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pcntl
      - run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
      - name: Run Task 12 production tests
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database == 'mysql' && 3306 || 5432 }}
          DB_DATABASE: dombi_test
          DB_USERNAME: ${{ matrix.database == 'mysql' && 'root' || 'postgres' }}
          DB_PASSWORD: ${{ matrix.database == 'mysql' && 'root' || 'postgres' }}
        run: php artisan test tests/Feature/PaymentFulfilmentConcurrencyTest.php

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Run Pint
        run: composer lint

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
