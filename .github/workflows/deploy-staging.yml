name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend
        env:
          APP_ENV: staging
          DOKU_CLIENT_ID: ${{ secrets.DOKU_CLIENT_ID }}
          DOKU_API_KEY: ${{ secrets.DOKU_API_KEY }}
          DOKU_IS_SANDBOX: "true"
          DOKU_CALLBACK_URL: https://staging.dombicenter.com/payment/doku/notify
          DOKU_ENABLED_METHODS: qris,transfer,ewallet,credit_card
        run: |
          : "${DOKU_CLIENT_ID:?DOKU_CLIENT_ID secret is required}"
          : "${DOKU_API_KEY:?DOKU_API_KEY secret is required}"
          composer install --no-dev --no-interaction --optimize-autoloader
          npm ci
          npm run build

      - name: Deploy code via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd domains/dombicenter.com/public_html/staging
            DEPLOY_SHA='${{ github.sha }}'
            echo "Deploying SHA $DEPLOY_SHA to staging"
            git fetch --no-tags origin "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            echo "SHA verified, running composer install"
            composer install --no-dev --no-interaction --optimize-autoloader
            echo "Running migrations"
            php artisan migrate --force --no-interaction
            php artisan config:clear
            php artisan route:clear

            # Same host, same failure mode as production: FileStore::flush() can
            # return false while entries survive, and the reported error is not a
            # permission diagnosis. Judge the store by what is left on disk.
            cache_entries() {
              find storage/framework/cache/data -type f ! -name '.gitignore' 2>/dev/null | wc -l | tr -d ' '
            }

            php artisan cache:clear || echo "cache:clear reported failure; checking the store directly"
            remaining="$(cache_entries)"
            if [ "$remaining" -gt 0 ]; then
              echo "cache store holds $remaining entries after cache:clear; clearing directly"
              find storage/framework/cache/data -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
              remaining="$(cache_entries)"
              if [ "$remaining" -gt 0 ]; then
                echo "cache store still holds $remaining entries after direct clear"
                exit 1
              fi
            fi
            echo "cache store empty; continuing"

            php artisan view:clear
            php artisan storage:link || true
            echo "Running canonical payment verifier"
            php artisan payments:verify-cutover
            echo "Staging code and migrations done"

      - name: Upload built assets via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "public/build/*"
          target: "domains/dombicenter.com/public_html/staging/"
          strip_components: 0

      - name: Verify staging health
        if: always()
        run: |
          echo "Waiting 10s for app to boot"
          sleep 10
          curl --fail --max-time 30 --retry 3 --retry-delay 5 https://staging.dombicenter.com/up
          echo "Staging health check passed"
          curl --fail --max-time 30 https://staging.dombicenter.com/api/health || echo "api/health check attempted"
