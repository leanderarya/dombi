name: Deploy Staging

on:
  workflow_run:
    workflows: [Quality Gate]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Quality Gate push run on develop
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.STAGING_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Verify trusted CI provenance
        id: release
        uses: actions/github-script@v7
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
        with:
          script: |
            const select = require('./scripts/ci/select-release.cjs');
            await select({github, context, core, runId: process.env.CI_RUN_ID});
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.release.outputs.artifact_id }}
          run-id: ${{ steps.release.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: transfer
          merge-multiple: true
      - name: Prepare verified transfer
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          python3 scripts/ci/release.py verify --archive transfer/release.tar.gz --sha "$RELEASE_SHA" --checksum-file transfer/release.sha256
          cp scripts/ci/release.py scripts/ci/deploy-staging.sh transfer/
      - name: Require pinned SSH identity
        env:
          FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
        run: test -n "$FINGERPRINT"
      - name: Prepare exclusive private staging transfer
        uses: appleboy/ssh-action@v1
        env:
          TRANSFER_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          fingerprint: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          envs: TRANSFER_ID
          script: |
            set -eu
            umask 077
            root="$HOME/domains/dombicenter.com/public_html/staging"
            test -d "$root"
            test "$(realpath "$root")" = "$root"
            parent="$HOME/dombi-ci-staging"
            if test ! -e "$parent" && test ! -L "$parent"; then mkdir -m 700 "$parent"; fi
            test ! -L "$parent"
            test -O "$parent"
            test "$(realpath "$parent")" = "$parent"
            test "$(stat -c %a "$parent")" = 700
            mkdir -m 700 "$parent/$TRANSFER_ID"
      - name: Upload into private run-owned directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          fingerprint: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          source: transfer/*
          target: dombi-ci-staging/${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
      - name: Deploy staging only
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TRANSFER_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STAGING_DB_DATABASE: ${{ secrets.STAGING_DATABASE_NAME }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          fingerprint: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          envs: RELEASE_SHA,TRANSFER_ID,STAGING_DB_DATABASE
          script: |
            set -eu
            bash "$HOME/dombi-ci-staging/$TRANSFER_ID/deploy-staging.sh" "$HOME/dombi-ci-staging/$TRANSFER_ID" "$RELEASE_SHA"
      - name: Health and deployed asset checks
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          python3 scripts/ci/release.py extract --archive transfer/release.tar.gz --sha "$RELEASE_SHA" --checksum-file transfer/release.sha256 --output "$RUNNER_TEMP/expected"
          python3 scripts/ci/health.py "$RUNNER_TEMP/expected"
      - name: Record accepted staging artifact
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          ARTIFACT_ID: ${{ steps.release.outputs.artifact_id }}
          ARTIFACT_RUN_ID: ${{ steps.release.outputs.artifact_run_id }}
          CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          receipt = {key.lower(): os.environ[key] for key in ('RELEASE_SHA', 'ARTIFACT_ID', 'ARTIFACT_RUN_ID', 'CI_RUN_ID', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
          receipt['sha256'] = pathlib.Path('transfer/release.sha256').read_text().split()[0]
          receipt['status'] = 'staging-health-and-assets-passed'
          pathlib.Path('staging-acceptance.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Staging PASS: `{receipt['release_sha']}`, artifact `{receipt['artifact_id']}`, SHA-256 `{receipt['sha256']}`. Both health endpoints and every built asset matched. Runtime worker adoption and business smoke are not proved.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: staging-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-acceptance.json
          retention-days: 90
      - name: Failure disposition
        if: failure()
        run: echo 'Staging FAIL. No acceptance issued. If mutation began, inspect the private before-code archive and maintenance state; do not blindly migrate back or reopen.' >> "$GITHUB_STEP_SUMMARY"
