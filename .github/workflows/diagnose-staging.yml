name: Diagnose Staging Environment

on:
  workflow_dispatch:

concurrency:
  group: diagnose-staging
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Read safe staging metadata via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -eu
            APP_PATH='domains/dombicenter.com/public_html/staging'
            cd "$APP_PATH"

            echo '=== deployment identity ==='
            printf 'hostname: '; hostname
            printf 'path: '; pwd
            printf 'branch: '; git branch --show-current 2>/dev/null || echo 'unavailable'
            printf 'commit: '; git rev-parse HEAD
            printf 'origin: '; git remote get-url origin 2>/dev/null || echo 'unavailable'

            echo '=== Laravel environment (safe values only) ==='
            php artisan about --only=environment,database 2>/dev/null || true
            php -r "require 'vendor/autoload.php'; \$app=require 'bootstrap/app.php'; \$app->make(Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap(); echo 'app_env: '.config('app.env').PHP_EOL; echo 'db_connection: '.config('database.default').PHP_EOL; echo 'db_database: '.config('database.connections.'.config('database.default').'.database').PHP_EOL; echo 'legacy_writes_enabled: '.(config('doku.legacy_writes_enabled') ? 'true' : 'false').PHP_EOL; echo 'legacy_writes_evidence: '.(config('doku.legacy_writes_deployment_evidence') ?? 'unset').PHP_EOL; echo 'payment_cutover_at: '.(config('doku.payment_cutover_at') ?? 'unset').PHP_EOL;"

            echo '=== payment runtime (read-only) ==='
            php artisan tinker --execute='
                $lines = [];
                foreach (\App\Models\PaymentAttempt::with("order")->latest("id")->limit(5)->get() as $a) {
                    $lines[] = [
                        "attempt_id" => $a->id,
                        "order_code" => $a->order?->order_code,
                        "order_status" => $a->order?->status,
                        "payment_status" => $a->order?->payment_status,
                        "paid_at" => $a->order?->paid_at?->toIso8601String(),
                        "invoice_number" => $a->invoice_number,
                        "creation_state" => $a->creation_state?->value,
                        "settlement_status" => $a->settlement_status?->value,
                        "verification_status" => $a->verification_status?->value,
                        "amount_snapshot" => $a->amount_snapshot,
                        "gateway_amount" => $a->gateway_amount,
                        "gateway_status" => $a->gateway_status,
                        "last_event_source" => data_get($a->metadata, "last_event_source"),
                        "last_event_anomaly" => data_get($a->metadata, "last_event_anomaly"),
                        "reconciled_at" => $a->reconciled_at?->toIso8601String(),
                        "raw_response" => substr((string) json_encode($a->raw_response), 0, 700),
                    ];
                }
                echo json_encode($lines, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL;
            ' 2>&1 | tail -120

            echo '=== webhook logs (read-only) ==='
            php artisan tinker --execute='
                foreach (\App\Models\PaymentWebhookLog::latest("id")->limit(8)->get() as $l) {
                    echo json_encode([
                        "id" => $l->id,
                        "source" => $l->source,
                        "invoice_number" => $l->invoice_number,
                        "status" => $l->status,
                        "signature_valid" => $l->signature_valid,
                        "mapped_status" => $l->mapped_status,
                        "error" => $l->error,
                        "created_at" => $l->created_at?->toIso8601String(),
                    ], JSON_UNESCAPED_SLASHES).PHP_EOL;
                }
            ' 2>&1 | tail -30

            echo '=== providerAmount present at runtime? ==='
            php artisan tinker --execute='echo method_exists(\App\Services\DokuService::class, "providerAmount") ? "providerAmount: yes" : "providerAmount: NO";' 2>&1 | tail -3

            echo '=== deployed file / opcache ==='
            printf 'DokuService.php mtime: '; date -r app/Services/DokuService.php '+%Y-%m-%d %H:%M:%S %z' 2>/dev/null || stat -c '%y' app/Services/DokuService.php 2>/dev/null || echo unknown
            printf 'providerAmount in file: '; grep -c 'providerAmount' app/Services/DokuService.php || true
            printf 'order.amount read in file: '; grep -c "order.amount" app/Services/DokuService.php || true
            php -r 'echo "opcache.enable=".ini_get("opcache.enable").PHP_EOL; echo "opcache.enable_cli=".ini_get("opcache.enable_cli").PHP_EOL; echo "opcache.validate_timestamps=".ini_get("opcache.validate_timestamps").PHP_EOL; echo "opcache.revalidate_freq=".ini_get("opcache.revalidate_freq").PHP_EOL;' 2>&1 | tail -6
            php -r 'if (function_exists("opcache_get_status")) { $s=@opcache_get_status(false); if (is_array($s)) { $hit=$s["opcache_statistics"]["num_cached_scripts"] ?? "n/a"; echo "opcache cached scripts: ".$hit.PHP_EOL; echo "opcache last restart: ".(isset($s["opcache_statistics"]["last_restart_time"]) ? date("c", $s["opcache_statistics"]["last_restart_time"]) : "never").PHP_EOL; } else { echo "opcache status unavailable".PHP_EOL; } }' 2>&1 | tail -4

            echo '=== payment log tails ==='
            for f in reconcile-doku expire-unknown-payments; do
              echo "--- storage/logs/${f}.log (last 15) ---"
              tail -15 "storage/logs/${f}.log" 2>/dev/null || echo '(no log)'
            done
            echo '--- storage/logs/laravel.log (payment lines, last 25) ---'
            grep -iE "doku|payment" storage/logs/laravel.log 2>/dev/null | tail -25 || echo '(no log)'

            echo '=== migration state ==='
            php artisan migrate:status --no-ansi | tail -30

            echo '=== health ==='
            php artisan route:list --path=up --compact --no-ansi 2>/dev/null || true
            curl --fail --max-time 30 --retry 2 --retry-delay 3 https://staging.dombicenter.com/up >/dev/null
            echo 'staging health: OK'
