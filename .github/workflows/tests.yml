name: Quality Gate

on:
  workflow_call:
  pull_request:
    branches: [develop, main]
  # The bootstrap release branch packages itself. Pushes to develop/main still do
  # not trigger this workflow, so their existing behaviour is unchanged.
  push:
    branches: [feat/v1-admission-bootstrap-20261115]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dombi_test
          MYSQL_ROOT_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      RUN_PRODUCTION_DRIVER_TESTS: "true"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dombi_test
      DB_USERNAME: root
      DB_PASSWORD: ci-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pcntl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: npm run build
      - run: composer lint:check
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run types:check
      # Run suites as separate, ordered invocations; race-gate tests fork their
      # own workers against shared MySQL, so no external PHPUnit parallelism.
      - run: php artisan test --testsuite Unit
      - run: php artisan test --testsuite Feature
      - run: npm test

  # Packages the admission-bootstrap release branch. Scoped to this branch's push
  # so `workflow_call` (deploy.yml, deploy-staging.yml) and pull requests keep the
  # exact behaviour they have today.
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/v1-admission-bootstrap-20261115'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
      # Release tooling is pinned to the develop commit that owns scripts/ci/release.py.
      TOOLING_SHA: dbfe218de8cc3ae49796524007e214ec8dfe464a
      RELEASE_PY_SHA256: 198d17ed33727044348fbee95fe640c60b5b57ab715c1f9627dc9eaeb6d6e1ea
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The application tree must be exactly the commit being packaged. A dirty or
      # misidentified tree would let release.py stamp wrong provenance.
      - name: Application HEAD is the packaged commit and tree is clean
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"

      # Tooling is fetched outside the application checkout and is never shipped:
      # release.py's allowed() rejects `scripts/`.
      - name: Fetch pinned release tooling outside the application checkout
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tooling"
          git -C "$RUNNER_TEMP/tooling" init -q
          git -C "$RUNNER_TEMP/tooling" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$RUNNER_TEMP/tooling" fetch --depth 1 origin "$TOOLING_SHA" \
            || git -C "$RUNNER_TEMP/tooling" fetch --depth 1 origin develop
          git -C "$RUNNER_TEMP/tooling" checkout --detach FETCH_HEAD

      # Fail closed on tooling drift: wrong commit, or release.py bytes not the pin.
      - name: Verify tooling SHA and release.py checksum
        run: |
          set -eu
          test "$(git -C "$RUNNER_TEMP/tooling" rev-parse HEAD)" = "$TOOLING_SHA"
          actual="$(sha256sum "$RUNNER_TEMP/tooling/scripts/ci/release.py" | cut -d' ' -f1)"
          test "$actual" = "$RELEASE_PY_SHA256"
          echo "tooling $TOOLING_SHA verified; release.py $actual"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pcntl, pdo_mysql, gd, zip, intl, bcmath
          tools: composer:v2
          coverage: none

      # The Vite build shells out to `php artisan wayfinder:generate`, so the
      # application must be bootable before assets are built. `.env` must exist
      # before `composer install`, because the post-autoload `package:discover`
      # script boots the framework and exits non-zero without it.
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate

      # Assets must be built from the application commit, from the lockfile.
      - run: npm ci --engine-strict --no-audit --no-fund
      - run: npm run build

      # The artifact must not contain a dev vendor tree; assemble the production
      # one separately and leave the tested workspace untouched.
      - name: Assemble production dependencies without changing the application tree
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/runtime"
          cp composer.json composer.lock "$RUNNER_TEMP/runtime/"
          composer install --working-dir="$RUNNER_TEMP/runtime" --no-dev --no-scripts \
            --no-interaction --prefer-dist --optimize-autoloader
          composer check-platform-reqs --working-dir="$RUNNER_TEMP/runtime" --no-dev

      - name: Pack release with the pinned tool and exact application SHA
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 "$RUNNER_TEMP/tooling/scripts/ci/release.py" pack \
            --root . \
            --vendor "$RUNNER_TEMP/runtime/vendor" \
            --sha "${{ github.sha }}" \
            --output "$RUNNER_TEMP/release"

      # Independent verification: the tool re-verifies, and sha256sum re-checks the
      # receipt, so a corrupt archive cannot pass on one code path alone.
      - name: Verify archive integrity and checksum independently
        run: |
          set -eu
          python3 "$RUNNER_TEMP/tooling/scripts/ci/release.py" verify \
            --archive "$RUNNER_TEMP/release/release.tar.gz" \
            --sha "${{ github.sha }}" \
            --checksum-file "$RUNNER_TEMP/release/release.sha256"
          (cd "$RUNNER_TEMP/release" && sha256sum -c release.sha256)
          test -s "$RUNNER_TEMP/release/release.tar.gz"
          test -s "$RUNNER_TEMP/release/release.sha256"

      # Fail closed if an artifact already exists for this commit: the release is
      # immutable, so re-uploading the same name must be an error, not an overwrite.
      - name: Refuse to replace an existing artifact for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const name = `release-${context.sha}`;
            const found = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name, per_page: 100,
            });
            const live = found.filter(a => !a.expired);
            if (live.length > 0) {
              core.setFailed(`Immutable artifact ${name} already exists; refusing to replace it.`);
            }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          overwrite: false
          retention-days: 90
