name: Quality Gate

on:
  workflow_call:
  pull_request:
    branches: [develop, main]
  # A main merge must produce its own immutable artifact: the production
  # pipeline deploys `release-<merge sha>` and nothing else.
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# One packaging run per commit; never cancel an in-flight build that a deploy
# may already be waiting on.
concurrency:
  group: quality-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dombi_test
          MYSQL_ROOT_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      RUN_PRODUCTION_DRIVER_TESTS: "true"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dombi_test
      DB_USERNAME: root
      DB_PASSWORD: ci-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pcntl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: npm run build
      - run: composer lint:check
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run types:check
      # Run suites as separate, ordered invocations; race-gate tests fork their
      # own workers against shared MySQL, so no external PHPUnit parallelism.
      - run: php artisan test --testsuite Unit
      - run: php artisan test --testsuite Feature
      - run: npm test
      - name: Locate an existing immutable release for this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {...context.repo, name: `release-${context.sha}`, per_page: 100});
            if (artifacts.some(a => !a.expired)) {
              core.setOutput('found', 'true');
              await core.summary.addRaw('Existing immutable release retained; not rebuilding or replacing it.\n').write();
            }
      - name: Assemble production dependencies without changing the tested workspace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.existing.outputs.found != 'true'
        run: |
          mkdir "$RUNNER_TEMP/runtime"
          cp composer.json composer.lock "$RUNNER_TEMP/runtime/"
          composer install --working-dir="$RUNNER_TEMP/runtime" --no-dev --no-scripts --no-interaction --prefer-dist --optimize-autoloader
          composer check-platform-reqs --working-dir="$RUNNER_TEMP/runtime" --no-dev
          python3 scripts/ci/release.py pack --root . --vendor "$RUNNER_TEMP/runtime/vendor" --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.existing.outputs.found != 'true'
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          overwrite: false
          retention-days: 90
