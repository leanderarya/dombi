name: Quality Gate

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dombi_test
          MYSQL_ROOT_PASSWORD: ci-password
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      RUN_PRODUCTION_DRIVER_TESTS: "true"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dombi_test
      DB_USERNAME: root
      DB_PASSWORD: ci-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pcntl, pdo_mysql, gd, zip, intl, bcmath
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: npm ci --engine-strict --no-audit --no-fund
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Require staging filesystem test tools
        run: for tool in rsync flock realpath sha256sum; do command -v "$tool" >/dev/null || exit 1; done
      - run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - run: node --test scripts/ci/test-select-release.cjs
      - run: npm test
      - run: npm run build
      - name: Focused PHP regression gate (ordered, no parallel workers)
        run: |
          php artisan test --testsuite Unit
          php artisan test tests/Feature/CanonicalPaymentVerifierTest.php tests/Feature/CheckoutPaymentJsonResponseTest.php tests/Feature/DokuWebhookIngressTest.php tests/Feature/PaymentAuthorizationMutationTest.php tests/Feature/PaymentFulfilmentConcurrencyTest.php
      - name: Dependency files must remain unchanged
        run: git diff --exit-code -- composer.json composer.lock package.json package-lock.json
      - name: Locate existing immutable release for this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {...context.repo, name: `release-${context.sha}`, per_page: 100});
            if (artifacts.some(a => !a.expired)) {
              core.setOutput('found', 'true');
              await core.summary.addRaw('Existing immutable release retained; not rebuilding or replacing it.\n').write();
            }
      - name: Assemble production dependencies without changing tested workspace
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.existing.outputs.found != 'true'
        run: |
          mkdir "$RUNNER_TEMP/runtime"
          cp composer.json composer.lock "$RUNNER_TEMP/runtime/"
          composer install --working-dir="$RUNNER_TEMP/runtime" --no-dev --no-scripts --no-interaction --prefer-dist --optimize-autoloader
          composer check-platform-reqs --working-dir="$RUNNER_TEMP/runtime" --no-dev
          python3 scripts/ci/release.py pack --root . --vendor "$RUNNER_TEMP/runtime/vendor" --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.existing.outputs.found != 'true'
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          overwrite: false
          retention-days: 90
