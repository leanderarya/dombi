name: Rollback Staging

on:
  workflow_dispatch:
    inputs:
      deployment_run_id:
        description: Failed Deploy Staging workflow run ID
        required: true
        type: string
      deployment_attempt:
        description: Failed deployment attempt number
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  rollback:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.repository == 'leanderarya/dombi' && github.actor == 'leanderarya' && github.ref == 'refs/heads/develop' && github.workflow_ref == 'leanderarya/dombi/.github/workflows/rollback-staging.yml@refs/heads/develop' && github.workflow_sha == github.sha
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify owner dispatch and exact develop workflow revision
        id: dispatch
        env:
          STAGING_EVENT_NAME: ${{ github.event_name }}
          STAGING_WORKFLOW_KIND: rollback
          STAGING_REPOSITORY: ${{ github.repository }}
          STAGING_ACTOR: ${{ github.actor }}
          STAGING_REF: ${{ github.ref }}
          STAGING_WORKFLOW_REF: ${{ github.workflow_ref }}
          STAGING_WORKFLOW_SHA: ${{ github.workflow_sha }}
          STAGING_SOURCE_SHA: ${{ github.sha }}
          STAGING_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/ci/verify-staging-dispatch.cjs
      - name: Verify workflow checkout revision
        env:
          STAGING_WORKFLOW_SHA: ${{ steps.dispatch.outputs.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$STAGING_WORKFLOW_SHA"
      - name: Verify failed staging deployment
        id: target
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          DEPLOYMENT_ATTEMPT: ${{ inputs.deployment_attempt }}
        with:
          script: |
            const select = require('./scripts/ci/select-failed-staging-run.cjs');
            await select({
              github, context, core,
              runId: process.env.DEPLOYMENT_RUN_ID,
              attempt: process.env.DEPLOYMENT_ATTEMPT,
            });
      - uses: actions/download-artifact@v4
        with:
          name: staging-target-${{ inputs.deployment_run_id }}-${{ inputs.deployment_attempt }}
          run-id: ${{ inputs.deployment_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target
      - name: Verify immutable deployment target
        id: immutable
        env:
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          DEPLOYMENT_ATTEMPT: ${{ inputs.deployment_attempt }}
          DEPLOYMENT_WORKFLOW_SHA: ${{ steps.target.outputs.workflow_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          target = json.loads(pathlib.Path('target/deployment-target.json').read_text())
          expected = {
              'release_sha': 'dbfe218de8cc3ae49796524007e214ec8dfe464a',
              'ci_run_id': '43720516972',
              'artifact_id': '14164321503',
              'artifact_run_id': '43720516972',
              'archive_sha256': '16f7aa17486f7264da7e8d25110eb5dad8358ff1e42c2352f91e6ba329ed8f8b',
              'github_run_id': os.environ['DEPLOYMENT_RUN_ID'],
              'github_run_attempt': os.environ['DEPLOYMENT_ATTEMPT'],
              'repository': 'leanderarya/dombi',
              'actor': 'leanderarya',
              'ref': 'refs/heads/develop',
              'workflow_ref': 'leanderarya/dombi/.github/workflows/deploy-staging.yml@refs/heads/develop',
          }
          workflow_sha = target.get('workflow_sha')
          if (workflow_sha != os.environ['DEPLOYMENT_WORKFLOW_SHA'] or
              target.get('source_sha') != workflow_sha or
              len(workflow_sha or '') != 40 or
              any(char not in '0123456789abcdef' for char in (workflow_sha or ''))):
              raise SystemExit('Failed run target does not bind its exact workflow revision')
          expected['workflow_sha'] = workflow_sha
          expected['source_sha'] = workflow_sha
          if target != expected:
              raise SystemExit('Failed run does not bind the approved V1.0 artifact')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'workflow_sha={workflow_sha}\n')
          PY
      - name: Install runner-only OpenSSH password helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-client sshpass
      - name: Verify pinned SSH identity
        env:
          FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
        run: test -n "$FINGERPRINT"
      - name: Restore the run-owned staging snapshot and keep maintenance enabled
        id: restore
        env:
          TRANSFER_ID: ${{ steps.target.outputs.transfer_id }}
          RELEASE_SHA: dbfe218de8cc3ae49796524007e214ec8dfe464a
          STAGING_WORKFLOW_SHA: ${{ steps.immutable.outputs.workflow_sha }}
          STAGING_DATABASE_NAME: ${{ secrets.STAGING_DATABASE_NAME }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
        run: python3 -B scripts/ci/staging_deploy_transport.py rollback
      - name: Prepare verified old asset inventory
        run: |
          expected="$RUNNER_TEMP/rollback-expected"
          test ! -e "$expected" && test ! -L "$expected"
          mkdir -m 700 "$expected"
          cp rollback-transfer/rollback-release.json "$expected/release.json"
      - name: Activate restored code for external acceptance
        id: activate
        env:
          TRANSFER_ID: ${{ steps.target.outputs.transfer_id }}
          RELEASE_SHA: dbfe218de8cc3ae49796524007e214ec8dfe464a
          STAGING_WORKFLOW_SHA: ${{ steps.immutable.outputs.workflow_sha }}
          STAGING_DATABASE_NAME: ${{ secrets.STAGING_DATABASE_NAME }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
        run: python3 -B scripts/ci/staging_deploy_transport.py activate
      - name: Verify restored JSON health and static assets
        run: python3 scripts/ci/health.py "$RUNNER_TEMP/rollback-expected"
      - name: Record rollback completion
        env:
          TRANSFER_ID: ${{ steps.target.outputs.transfer_id }}
          RELEASE_SHA: dbfe218de8cc3ae49796524007e214ec8dfe464a
          STAGING_WORKFLOW_SHA: ${{ steps.immutable.outputs.workflow_sha }}
          STAGING_DATABASE_NAME: ${{ secrets.STAGING_DATABASE_NAME }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
        run: python3 -B scripts/ci/staging_deploy_transport.py complete
      - name: Record rollback result
        run: |
          echo 'Rollback completed for one exact failed staging run. The executor verified the before-code receipt, refreshed code caches, passed read-only database identity checks, then external JSON /up and all static asset hashes before recording completion.' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore maintenance after failed rollback acceptance
        if: failure() && steps.activate.outcome != 'skipped'
        env:
          TRANSFER_ID: ${{ steps.target.outputs.transfer_id }}
          RELEASE_SHA: dbfe218de8cc3ae49796524007e214ec8dfe464a
          STAGING_WORKFLOW_SHA: ${{ steps.immutable.outputs.workflow_sha }}
          STAGING_DATABASE_NAME: ${{ secrets.STAGING_DATABASE_NAME }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
        run: python3 -B scripts/ci/staging_deploy_transport.py close
      - name: Failure disposition
        if: failure()
        run: echo 'Rollback FAIL. Preserve the transfer and inspect actual maintenance state. If external acceptance failed, the workflow attempted to close staging. Obtain a new staging-owner approval before another recovery attempt; do not rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
