name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ENV: production
      APP_URL: https://app.dombicenter.com
      DOKU_IS_SANDBOX: ${{ vars.DOKU_IS_SANDBOX }}
      DOKU_CLIENT_ID: ${{ secrets.DOKU_CLIENT_ID }}
      DOKU_API_KEY: ${{ secrets.DOKU_API_KEY }}
      DOKU_CALLBACK_URL: ${{ secrets.DOKU_CALLBACK_URL }}
      PAYMENTS_LEGACY_WRITES_ENABLED: ${{ vars.PAYMENTS_LEGACY_WRITES_ENABLED }}
    steps:
      - name: Validate production payment variables
        run: |
          set -eu
          case "$DOKU_IS_SANDBOX" in
            true|false) ;;
            *) echo 'DOKU_IS_SANDBOX must be explicitly true or false'; exit 1 ;;
          esac
          case "$PAYMENTS_LEGACY_WRITES_ENABLED" in
            true|false) ;;
            *) echo 'PAYMENTS_LEGACY_WRITES_ENABLED must be explicitly true or false'; exit 1 ;;
          esac
          if [ "$DOKU_IS_SANDBOX" != 'false' ]; then
            echo 'Production DOKU_IS_SANDBOX must be false'; exit 1
          fi
          if [ "$PAYMENTS_LEGACY_WRITES_ENABLED" != 'false' ]; then
            echo 'Production PAYMENTS_LEGACY_WRITES_ENABLED must be false'; exit 1
          fi
          echo 'Production payment variables validated.'

      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies & Build
        run: |
          APP_ENV=testing composer install --no-dev --no-interaction --optimize-autoloader
          npm ci
          npm run build

      - name: Deploy code via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd domains/dombicenter.com/public_html/app
            DOKU_IS_SANDBOX='${{ vars.DOKU_IS_SANDBOX }}'
            PAYMENTS_LEGACY_WRITES_ENABLED='${{ vars.PAYMENTS_LEGACY_WRITES_ENABLED }}'
            DEPLOY_SHA='${{ github.sha }}'
            echo "Deploying SHA $DEPLOY_SHA to production"
            git fetch --no-tags origin "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            echo "Production code synced"

      - name: Upload built assets via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "public/build/*"
          target: "domains/dombicenter.com/public_html/app/"
          strip_components: 0

      - name: Run migrations and cache clear via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd domains/dombicenter.com/public_html/app
            DOKU_IS_SANDBOX='${{ vars.DOKU_IS_SANDBOX }}'
            PAYMENTS_LEGACY_WRITES_ENABLED='${{ vars.PAYMENTS_LEGACY_WRITES_ENABLED }}'
            DEPLOY_SHA='${{ github.sha }}'
            echo "Production deploy SHA: $DEPLOY_SHA"
            if [ -d .git ]; then
              echo "Syncing git to $DEPLOY_SHA"
              git fetch --no-tags origin "$DEPLOY_SHA"
              git reset --hard "$DEPLOY_SHA"
              test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            else
              echo "No git repo in production (FTP mode), skipping git sync"
            fi
            set -eu
            sed -i '/DOKU_IS_SANDBOX/d; /PAYMENTS_LEGACY_WRITES_ENABLED/d' .env
            for key in DOKU_IS_SANDBOX PAYMENTS_LEGACY_WRITES_ENABLED; do
              value="${!key}"
              case "$value" in
                true|false) ;;
                *) echo "Invalid production value for $key"; exit 1 ;;
              esac
              if grep -q "^${key}=" .env; then
                sed -i "s/^${key}=.*/${key}=${value}/" .env
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
            done
            echo "Installing dependencies"
            composer install --no-dev --no-interaction --optimize-autoloader

            # Take the app down for the mutating window. The trap guarantees it
            # comes back up: a failure mid-window must not leave production dark.
            trap 'php artisan up >/dev/null 2>&1 || true' EXIT
            php artisan down --retry=15 --no-interaction || echo "artisan down failed; continuing"

            echo "Running migrations"
            php artisan migrate --force --no-interaction
            php artisan config:clear
            php artisan config:cache
            php artisan tinker --execute='if (config("app.env") !== "production" || config("app.debug") !== false || config("doku.sandbox") !== false || config("doku.legacy_writes_enabled") !== false) { exit(1); } echo "Production payment configuration assertion passed.", PHP_EOL;'
            php artisan route:clear

            # FileStore::flush() returns false on this shared host when the web
            # process holds the cache directory, which exited 1 here and skipped
            # the health gate (run 38030307352). Judge it by whether entries
            # actually survive, not by the exit code: a store that reports
            # success while keeping stale entries is the worse failure.
            cache_entries() {
              find storage/framework/cache/data -type f ! -name '.gitignore' 2>/dev/null | wc -l | tr -d ' '
            }

            php artisan cache:clear || echo "cache:clear reported failure; checking the store directly"
            remaining="$(cache_entries)"
            if [ "$remaining" -gt 0 ]; then
              echo "cache store holds $remaining entries after cache:clear; clearing directly"
              find storage/framework/cache/data -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
              remaining="$(cache_entries)"
              if [ "$remaining" -gt 0 ]; then
                echo "cache store still holds $remaining entries after direct clear"
                exit 1
              fi
            fi
            echo "cache store empty; continuing"

            php artisan view:clear
            php artisan storage:link || true

            php artisan up
            trap - EXIT
            echo "Production post-deploy done"

      # Safety net for the maintenance window above. The in-script trap cannot
      # fire if the SSH session is killed outright, and this host does drop
      # sessions, so the app is brought back up unconditionally. Running `up`
      # when the app is already live is a no-op.
      - name: Ensure production is not stuck in maintenance mode
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd domains/dombicenter.com/public_html/app
            if [ -f storage/framework/down ]; then
              echo "maintenance mode still active; bringing production back up"
              php artisan up
            else
              echo "production is not in maintenance mode"
            fi

      - name: Verify production health
        if: always()
        run: |
          echo "Waiting 15s for production to boot"
          sleep 15

          check_health() {
            local url="$1"
            local status

            if ! status="$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --max-time 30 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --write-out '%{http_code}' \
              "$url")"; then
              echo "Health check request failed: $url"
              return 1
            fi

            case "$status" in
              2??) echo "$url OK (HTTP $status)" ;;
              *) echo "$url returned HTTP $status"; return 1 ;;
            esac
          }

          check_health https://app.dombicenter.com/up
          check_health https://app.dombicenter.com/api/health
