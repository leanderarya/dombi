name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies & Build
        run: |
          composer install --no-dev --no-interaction --optimize-autoloader
          npm ci
          npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          server-dir: /domains/dombicenter.com/public_html/app/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/docs/**
            **/.env
            **/.env.example
            **/.env.staging.example
            **/.env.production.example
            **/.github/**
            **/.agents/**
            **/.claude/**
            **/.superpowers/**
            **/.opencode/**
            **/.codex/**
            **/.phpunit.cache/**
            **/storage/logs/**
            **/storage/framework/sessions/**
            **/storage/framework/cache/**
            **/storage/framework/views/**
            .editorconfig
            .eslintrc.cjs
            .npmrc
            .prettierrc
            .prettierignore
            phpunit.xml
            pint.json
            tsconfig.json
            vite.config.ts
            vitest.config.ts
            README.md
            DESIGN.md
            STITCH_PROMPTS.md
            skills-lock.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            package-lock.json

      - name: Run migrations and cache clear via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd domains/dombicenter.com/public_html/app
            DEPLOY_SHA='${{ github.sha }}'
            echo "Production deploy SHA: $DEPLOY_SHA"
            if [ -d .git ]; then
              echo "Syncing git to $DEPLOY_SHA"
              git fetch --no-tags origin "$DEPLOY_SHA"
              git reset --hard "$DEPLOY_SHA"
              test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            else
              echo "No git repo in production (FTP mode), skipping git sync"
            fi
            echo "Installing dependencies"
            composer install --no-dev --no-interaction --optimize-autoloader
            echo "Running migrations"
            php artisan migrate --force --no-interaction
            php artisan config:clear
            php artisan route:clear
            php artisan cache:clear
            php artisan view:clear
            php artisan storage:link || true
            echo "Production post-deploy done"

      - name: Verify production health
        run: |
          echo "Waiting 15s for production to boot"
          sleep 15

          check_health() {
            local url="$1"
            local status

            if ! status="$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --max-time 30 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --write-out '%{http_code}' \
              "$url")"; then
              echo "Health check request failed: $url"
              return 1
            fi

            case "$status" in
              2??) echo "$url OK (HTTP $status)" ;;
              *) echo "$url returned HTTP $status"; return 1 ;;
            esac
          }

          check_health https://app.dombicenter.com/up
          check_health https://app.dombicenter.com/api/health
