name: Production Promotion Preflight (execution disabled)

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful Deploy Staging run with acceptance receipt
        required: true
        type: string
      staging_attempt:
        description: Accepted staging run attempt
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate staging acceptance provenance
        id: staging
        uses: actions/github-script@v7
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          STAGING_ATTEMPT: ${{ inputs.staging_attempt }}
        with:
          script: |
            const id = process.env.STAGING_RUN_ID;
            const attempt = process.env.STAGING_ATTEMPT;
            if (!/^\d+$/.test(id) || !/^\d+$/.test(attempt)) throw new Error('Numeric run/attempt required');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)});
            if (run.path !== '.github/workflows/deploy-staging.yml' || run.conclusion !== 'success' || run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` || run.run_attempt !== Number(attempt)) throw new Error('Untrusted or unsuccessful staging run');
            core.setOutput('name', `staging-acceptance-${id}-${attempt}`);
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.staging.outputs.name }}
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: acceptance
      - name: Resolve the exact accepted release (no rebuild)
        id: release
        uses: actions/github-script@v7
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          STAGING_ATTEMPT: ${{ inputs.staging_attempt }}
        with:
          script: |
            const fs = require('fs');
            const receipt = JSON.parse(fs.readFileSync('acceptance/staging-acceptance.json', 'utf8'));
            if (receipt.status !== 'staging-health-and-assets-passed' || receipt.github_run_id !== process.env.STAGING_RUN_ID || receipt.github_run_attempt !== process.env.STAGING_ATTEMPT || !/^[a-f0-9]{64}$/.test(receipt.sha256)) throw new Error('Invalid acceptance binding');
            const select = require('./scripts/ci/select-release.cjs');
            await select({github, context, core, runId: receipt.ci_run_id, accepted: receipt});
            core.setOutput('checksum', receipt.sha256);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.release.outputs.artifact_id }}
          run-id: ${{ steps.release.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release
          merge-multiple: true
      - name: Verify accepted bytes
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
        run: |
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          python3 scripts/ci/release.py verify --archive release/release.tar.gz --sha "$RELEASE_SHA" --checksum "$CHECKSUM"
      - name: Fail-closed production execution gate
        run: |
          echo 'Production NO-GO: execution is disabled in code, not controlled by a secret or dispatch toggle.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifact preflight does not authorize deployment. Follow docs/CI_CD.md production gates and the applicable pinned recovery contract. No SSH, migration, cache invalidation, recovery or reopening is performed.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
