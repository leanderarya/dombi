name: Production Release Preparation (NO DEPLOY)

# This replaces automatic production deployment during the V1 cutover hold.
# Pushes and manual runs may validate/package only. Re-enabling deployment
# requires a separately reviewed change and the owner gate in the runbook.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/tests.yml

  package:
    needs: quality
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DOKU_IS_SANDBOX: "true"
      PAYMENTS_LEGACY_WRITES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build candidate assets without production access
        run: |
          set -eu
          composer install --no-dev --no-interaction --optimize-autoloader
          npm ci
          npm run build
          git rev-parse HEAD > public/build/RELEASE_SHA
          (cd public/build && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Retain candidate assets for review
        uses: actions/upload-artifact@v4
        with:
          name: dombi-v1-assets-${{ github.sha }}
          path: public/build/
          if-no-files-found: error
          retention-days: 14

      - name: Record production hold
        run: |
          echo 'Preparation only. No server connection, migration, configuration update, or traffic switch.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cutover requires independent database/writer verification and last-mile owner approval in docs/PRODUCTION-CUTOVER-V1.md.' >> "$GITHUB_STEP_SUMMARY"
